<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitallis — Assistente Hospitalar</title>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#111720;
    --panel2:#151d28;
    --line:#263241;
    --text:#edf3f8;
    --muted:#9aa8b7;
    --blue:#4f8cff;
    --blue-soft:#15365c;
    --cyan:#43c6d9;
    --green:#28c76f;
    --yellow:#f4b740;
    --red:#ef5b5b;
    --purple:#9b7cff;
    --font: Inter, "Segoe UI", Arial, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    color:var(--text);
    font-family:var(--font);
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#0a0e13,#10161f);
  }

  .shell{
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    height:100vh;
    padding:0 20px;
  }

  header{
    padding:24px 4px 16px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
  }

  .brand{
    font-size:25px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .brand span{ color:var(--blue); }

  header p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    max-width:440px;
  }

  .badge{
    border:1px solid #314154;
    background:#111a25;
    border-radius:999px;
    padding:8px 12px;
    color:#c8d4df;
    font-size:11.5px;
    font-weight:700;
    white-space:nowrap;
    flex-shrink:0;
  }

  /* --- messages --- */
  .messages{
    flex:1;
    overflow-y:auto;
    padding:24px 4px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }

  .messages::-webkit-scrollbar{ width:8px; }
  .messages::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .row{
    display:flex;
    max-width:88%;
  }
  .row.user{ align-self:flex-end; justify-content:flex-end; }
  .row.assistant{ align-self:flex-start; }

  .bubble{
    padding:12px 15px;
    border-radius:12px;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .row.user .bubble{
    background:var(--blue);
    color:#06101f;
    border-bottom-right-radius:3px;
    font-weight:600;
  }

  .row.assistant .bubble{
    background:var(--panel2);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }

  .row.error .bubble{
    background:#2a1418;
    border:1px solid #4a2129;
    color:#ff8d8d;
  }

  .thinking{
    display:flex;
    gap:5px;
    align-items:center;
    padding:14px 15px;
  }
  .thinking span{
    width:6px; height:6px; border-radius:50%;
    background:var(--muted);
    animation:pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay:0.15s; }
  .thinking span:nth-child(3){ animation-delay:0.3s; }
  @keyframes pulse{
    0%,80%,100%{ opacity:0.25; transform:scale(0.85); }
    40%{ opacity:1; transform:scale(1); }
  }

  /* --- starter chips --- */
  .starters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:2px 4px 20px;
    flex-shrink:0;
  }
  .starters.hidden{ display:none; }

  .chip{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:var(--font);
    font-size:13px;
    padding:8px 13px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .chip:hover{
    border-color:var(--blue);
    color:var(--text);
  }

  /* --- composer --- */
  .composer{
    flex-shrink:0;
    padding:14px 0 22px;
    border-top:1px solid var(--line);
  }

  .composer-inner{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px 8px 8px 16px;
  }

  .composer-inner:focus-within{
    border-color:var(--blue);
  }

  textarea{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--font);
    font-size:14.5px;
    line-height:1.5;
    max-height:120px;
    padding:8px 0;
  }
  textarea::placeholder{ color:var(--muted); }

  button.send{
    flex-shrink:0;
    width:38px;
    height:38px;
    border-radius:10px;
    border:none;
    background:var(--blue);
    color:#06101f;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .15s ease, transform .1s ease;
  }
  button.send:disabled{
    opacity:0.35;
    cursor:default;
  }
  button.send:not(:disabled):active{ transform:scale(0.94); }

  .hint{
    margin:10px 2px 0;
    font-size:11.5px;
    color:var(--muted);
  }

  @media (max-width:600px){
    header{ flex-direction:column; }
    .badge{ align-self:flex-start; }
  }

  @media (prefers-reduced-motion: reduce){
    .thinking span{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<div class="shell">
  <header>
    <div>
      <div class="brand">Vital<span>lis</span></div>
      <p>Assistente hospitalar — pergunte sobre internações, leitos e ocupação a nível hospitalar em São Paulo.</p>
    </div>
    <div class="badge">Dados SIH/SP · 2023–2025</div>
  </header>

  <div class="messages" id="messages"></div>

  <div class="starters" id="starters">
    <button class="chip" type="button">Qual hospital teve mais internações em 2024?</button>
    <button class="chip" type="button">Quais hospitais de SP têm menos leitos disponíveis?</button>
    <button class="chip" type="button">Compare a ocupação hospitalar entre 2023 e 2025</button>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <textarea
        id="input"
        rows="1"
        placeholder="Pergunte sobre os dados hospitalares..."
      ></textarea>
      <button class="send" id="sendBtn" type="button" aria-label="Enviar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <p class="hint">Enter envia · Shift+Enter quebra linha</p>
  </div>
</div>

<script>
  // Troque pela sua PAR URL do handler POST /ask (dataforge.chatbot)
  const CHATBOT_URL = "https://gbe88003bd2f373-challengeoracle.adb.sa-saopaulo-1.oraclecloudapps.com/ords/admin/_/par/uvbpKDJYJFPmvuozHGS8drn19b93fmJbdSaJ1bzkJwL0UNVmgYlckJWDma4AwpHUirkjyEWwhenCGFY9eBUF5wuWuqrIk4L0Qe56ijYxDzFj2b70d7hiJkz6LqZ2l/dataforge/chatbot/ask";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const startersEl = document.getElementById("starters");

  function addMessage(role, text){
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addThinking(){
    const row = document.createElement("div");
    row.className = "row assistant";
    row.id = "thinking-row";
    row.innerHTML = '<div class="bubble thinking"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeThinking(){
    const el = document.getElementById("thinking-row");
    if (el) el.remove();
  }

  function scrollToBottom(){
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function autoResize(){
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }

  async function askChatbot(prompt){
    // POST, mas com Content-Type "simples" (form-urlencoded) para não
    // disparar o preflight OPTIONS — o PAR só autoriza o método POST,
    // então o preflight (OPTIONS) sempre falharia.
    const res = await fetch(CHATBOT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ prompt }).toString()
    });

    if (!res.ok){
      throw new Error("O servidor respondeu com status " + res.status);
    }

    const data = await res.json();
    if (!data || typeof data.response !== "string"){
      throw new Error("Resposta em formato inesperado.");
    }
    return data.response;
  }

  async function handleSend(){
    const text = inputEl.value.trim();
    if (!text) return;

    startersEl.classList.add("hidden");
    addMessage("user", text);
    inputEl.value = "";
    autoResize();
    sendBtn.disabled = true;
    addThinking();

    try {
      const response = await askChatbot(text);
      removeThinking();
      addMessage("assistant", response);
    } catch (err){
      removeThinking();
      addMessage("error", "Não consegui responder agora: " + err.message);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", handleSend);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      handleSend();
    }
  });

  inputEl.addEventListener("input", autoResize);

  startersEl.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      inputEl.value = chip.textContent;
      handleSend();
    });
  });

  inputEl.focus();
</script>

</body>
</html>
